{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Student Hub{% endblock %}</title>
    <meta name="description" content="Student Hub - notes, projects, questions, lab manuals, placements, internships, and learning resources for students." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portal/css/style.css' %}" />
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand-block">
                <div class="brand-mark">🎓</div>
                <div class="brand-text">
                    <strong>Student Hub</strong>
                    <span>Learn • Prepare • Grow</span>
                </div>
            </div>

            <nav class="main-nav" aria-label="Main Navigation">
                <a href="#home">Home</a>
                <a href="#notes">Notes</a>
                <a href="#lab-manuals">Lab Manuals</a>
                <a href="#projects">Projects</a>
                <a href="#placements">Placements</a>
                <a href="#courses">Courses</a>
                <a href="#youtube">YouTube</a>
                <a href="#tools">Tools</a>
                <a href="#updates">Updates</a>
                <a href="#about">About</a>
            </nav>

            <a href="/admin/" class="admin-button">Admin</a>
        </header>

        {% block content %}{% endblock %}

        <footer class="site-footer">
            <div class="footer-brand">
                <div class="brand-mark small">🎓</div>
                <span>Student Hub</span>
            </div>
            <div class="footer-links">
                <a href="#home">Home</a>
                <a href="#notes">Notes</a>
                <a href="#lab-manuals">Lab Manuals</a>
                <a href="#projects">Projects</a>
                <a href="#about">About</a>
            </div>
            <div class="footer-socials">
                <a href="#">in</a>
                <a href="#">f</a>
                <a href="#">◎</a>
            </div>
        </footer>
    </div>
</body>
</html>
